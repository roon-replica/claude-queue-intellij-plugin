pluginGroup = dev.roon
pluginVersion = 0.4.4

# 지원 IDE 하한 — 2024.3 (worklist S4)
pluginSinceBuild = 243
platformVersion = 2024.3

# Gradle 런처 JVM — 셸 기본이 JDK 8 이라 지정 없이는 실행 자체가 안 된다
# (jvmToolchain 은 빌드스크립트 로딩 후라 이 단계를 못 고친다)
org.gradle.java.home = /path/to/jdk21

org.gradle.jvmargs = -Xmx2048m
# 빌드 캐시 끔 — 기본 파라미터 추가 같은 ABI 변경 후 옛 테스트 클래스를 복원해
# NoSuchMethodError 를 냈다. 빌드가 수초라 캐시 이득이 없다
org.gradle.caching = false
# 증분 컴파일도 끔 — main 의 기본 파라미터가 바뀌어도 테스트를 재컴파일하지 않아
# NoSuchMethodError(addTodo$default)를 반복해서 냈다. 전체 빌드가 5초라 손해가 없다
kotlin.incremental = false
org.gradle.configuration-cache = true
kotlin.stdlib.default.dependency = false
