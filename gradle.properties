pluginGroup = dev.roon
pluginVersion = 0.6.5

# 지원 IDE 하한 — 2025.3. 신(Reworked) 터미널 API 가 253 부터 있다.
#
# 코드는 243 에서도 돈다(runIde243 으로 확인: Class.forName 가드가 신 API 경로를 막고
# Classic 으로 동작). 하지만 마켓플레이스 자동 검사는 정적 분석이라 그 가드를 보지 못해
# 243~252 에서 "Package com.intellij.terminal.frontend is not found" 를 문제로 찍는다.
# 지킬 사용자가 없는 호환성 때문에 심사를 걸고 넘어질 이유가 없어 253 으로 좁혔다.
# 넓히는 건 나중에도 무해하지만(낮추기), 좁히는 건 쓰던 사람을 끊는다 — 좁게 시작한다.
pluginSinceBuild = 253
platformVersion = 2026.1

# Gradle 자체는 JVM 17+ 에서 돌아야 한다. 셸 기본 JDK 가 그보다 낮으면
# `JAVA_HOME` 을 지정하거나 `~/.gradle/gradle.properties` 에 org.gradle.java.home 을 둘 것 —
# 여기(레포)에 절대경로를 박으면 다른 사람 환경에서 빌드가 깨진다.
# (kotlin.jvmToolchain 은 빌드스크립트 로딩 후라 이 단계를 고치지 못한다)

org.gradle.jvmargs = -Xmx2048m
# 빌드 캐시 끔 — 기본 파라미터 추가 같은 ABI 변경 후 옛 테스트 클래스를 복원해
# NoSuchMethodError 를 냈다. 빌드가 수초라 캐시 이득이 없다
org.gradle.caching = false
# 증분 컴파일도 끔 — main 의 기본 파라미터가 바뀌어도 테스트를 재컴파일하지 않아
# NoSuchMethodError(addTodo$default)를 반복해서 냈다. 전체 빌드가 5초라 손해가 없다
kotlin.incremental = false
org.gradle.configuration-cache = true
kotlin.stdlib.default.dependency = false
